# AI Phone Receptionist — local development stack.
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Optional services (metabase, langfuse, prometheus, grafana) are behind profiles:
#   docker compose --profile analytics up -d
#   docker compose --profile observability up -d

name: receptionist

services:
  # ---------------------------------------------------------------------------
  # Postgres with pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receptionist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-receptionist}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receptionist}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (cache + job queue)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: .env
    volumes:
      - ./api:/app/api
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ---------------------------------------------------------------------------
  # Background worker (post-call jobs, notifications, daily report)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "api.worker"]
    env_file: .env
    volumes:
      - ./api:/app/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["worker"]

  # ---------------------------------------------------------------------------
  # Pipecat voice agent
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    command: ["python", "-m", "agent.main"]
    env_file: .env
    volumes:
      - ./agent:/app/agent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8765:8765"

  # ---------------------------------------------------------------------------
  # Next.js dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
    command: ["npm", "run", "dev"]
    env_file: .env
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Caddy — TLS + reverse proxy
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - dashboard
      - agent

  # ===========================================================================
  # Optional services (start with --profile analytics or --profile observability)
  # ===========================================================================

  metabase:
    image: metabase/metabase:latest
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-receptionist}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_DB_NAME: metabase
    ports:
      - "3030:3000"
    profiles: ["analytics"]
    depends_on:
      postgres:
        condition: service_healthy

  langfuse-server:
    image: langfuse/langfuse:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-receptionist}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_SALT: change-me
    ports:
      - "3001:3000"
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3031:3000"
    profiles: ["observability"]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  grafana_data: