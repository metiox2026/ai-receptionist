[project]
name = "ai-receptionist"
version = "0.1.0"
description = "Self-hosted AI phone receptionist."
requires-python = ">=3.11"
authors = [{ name = "Receptionist Maintainers" }]

# -----------------------------------------------------------------------------
# Core dependencies — split into optional groups so each service only installs
# what it needs. `uv sync --all-groups` for development.
# -----------------------------------------------------------------------------
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.25",                      # async job queue on Redis
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",  # JWT
    "passlib[bcrypt]>=1.7",
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=2.5",
]

agent = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pipecat-ai>=0.0.55",             # voice orchestration
    "websockets>=12.0",
    "anthropic>=0.34",                 # Claude Haiku
    "google-generativeai>=0.7",        # Gemini fallback
    "deepgram-sdk>=3.5",
    "cartesia>=1.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "prometheus-client>=0.20",
    "sentry-sdk>=2.5",
]

storage = [
    "boto3>=1.34",                     # S3-compatible storage
    "minio>=7.2",
]

integrations = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

notifications = [
    "resend>=0.7",                     # email
    "sendgrid>=6.11",                  # alt email
    "httpx>=0.27",                     # Telegram, Slack, webhooks
]

eval = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
    "anthropic>=0.34",                 # judge model for evals
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api"]

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests", "agent/tests", "eval"]